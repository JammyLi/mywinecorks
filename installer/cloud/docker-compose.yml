# MyWineCorks cloud server (app.mywinecorks.com) — one region.
# Put a TLS-terminating proxy (load balancer, Caddy, nginx) in front of port 3500.
#   cp .env.example .env   (fill in) → docker compose up -d
services:
  app:
    image: mywinecorks/server:${MWC_VERSION:-latest}
    restart: unless-stopped
    environment:
      MODE: cloud
      PUBLIC_URL: ${PUBLIC_URL}
      PROVISION_TOKEN: ${PROVISION_TOKEN}
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM}
      HTTPS_PORT: "0"
    ports:
      - "127.0.0.1:3500:3500"
    volumes:
      - data:/data
  litestream:
    image: litestream/litestream:0.5
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
      LITESTREAM_REGION: ${LITESTREAM_REGION}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on: [app]
volumes:
  data:
